<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1814" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Kids Landline</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div id="app"></div>
    <!-- Persist across screen re-renders so WebRTC audio isn't torn down mid-call -->
    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="call-root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
