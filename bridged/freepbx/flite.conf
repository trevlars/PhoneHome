;
; PhoneHome — Flite TTS for phonehome-announce (CT 121)
; Install: cp bridged/freepbx/flite.conf /etc/asterisk/flite.conf
;          asterisk -rx "module reload app_flite.so"
;
; Voice is NOT selectable via Flite() dialplan args on asterisk22-flite —
; Flite(text[,intkeys]) only; second arg is interrupt keys, not voice.
;
; Available: kal (US male diphone), kal16, rms (US male), awb (Scottish), slt (US female)
; PhoneHome uses slt — clearer US English than default kal.
;
[general]
voice=slt
samplerate=8000
usecache=no
