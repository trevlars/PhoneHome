; PhoneHome — managed AOR overlays (phonehome-set-sip-secret)
; max_contacts=1 avoids Avail+Unavail twins breaking Dial to remotes.
; Use (+type=aor) — bare (+) does not apply remove_unavailable on Asterisk 22.
; Live FreePBX file is rewritten on each ATA sync.
;
; NOTE: Alex/Riley (2001) uses the public SIP host via PVE TLS proxy, same as
; remote ATAs. Keep remove_unavailable=yes — lan (no) leaves a dead Unavail
; Contact stuck after qualify flaps (no ring + HT801 refuses outbound).

; PhoneHome ATA 2001 AOR (remote)
[2001](+type=aor)
max_contacts=1
remove_existing=yes
remove_unavailable=yes
qualify_frequency=60
qualify_timeout=8.0

; PhoneHome ATA 2002 AOR (remote)
[2002](+type=aor)
max_contacts=1
remove_existing=yes
remove_unavailable=yes
qualify_frequency=60
qualify_timeout=8.0

