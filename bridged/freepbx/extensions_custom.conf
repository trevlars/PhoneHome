; PhoneHome — route ATA speed-dial 0–9 into Stasis app "phonehome"
; Install on FreePBX CT 121:
;   cp bridged/freepbx/extensions_custom.conf /etc/asterisk/extensions_custom.conf  (merge)
;   fwconsole reload
;
; Requires ARI app registration from the bridged process (ari-client start).
; Inbound to FXS (softphone→ATA / ATA→ATA) uses ARI originate to PJSIP/<ext> —
; stock FreePBX extension dialplan rings the HT801; no extra inbound context needed.
;
; Dial 0 = TreeHouse (pad 0). Dial 1 = designated household parent (Home).
; Digits 2–9 = speed dial contacts. ATA in-call # → hold toggle (bridged ARI ChannelDtmfReceived).
; ATA *98 → Messages / greeting IVR (shared softphone inbox). Bare *
; also routes to Messages (HT801 P90 must include `*` so the FXS actually sends it).
; Requires app_flite (lab CT 121 has it). Screening announce leaves Stasis briefly,
; then re-enters with args=post-announce.

[from-internal-custom]
; Home / parent (slot 1) + TreeHouse (0) + speed dial 2–9
exten => 0,1,NoOp(PhoneHome TreeHouse ${EXTEN} from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,${EXTEN},1)

; Interim E911: ring household parent (HT801 Enable E911 + P8597). Real PSAP needs PSTN trunk.
exten => 911,1,NoOp(PhoneHome emergency 911 from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,911,1)
exten => 933,1,NoOp(PhoneHome emergency test 933 from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,933,1)

exten => 1,1,NoOp(PhoneHome Home/parent ${EXTEN} from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,${EXTEN},1)

exten => _[2-9],1,NoOp(PhoneHome speed-dial ${EXTEN} from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,${EXTEN},1)

; Optional: *0 … *9 also works (single digit after *). Do not use digit 9 for Messages.
exten => _*[0-9],1,NoOp(PhoneHome speed-dial ${EXTEN:1} from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,${EXTEN:1},1)

; *98 = Messages + greeting assistant (PhoneHome IVR). Exact match; does not steal *0–*9.
; Announce/CID runs on FXS answer (phonehome-announce), not on this feature code.
exten => *98,1,NoOp(PhoneHome Messages/greeting IVR from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,vm,1)

; Pulse handsets (no * key): dial 98 — same Messages IVR as *98.
exten => 98,1,NoOp(PhoneHome Messages IVR pulse 98 from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,vm,1)

; Softphone-parity: bare * → Messages (after HT801 No Key Timeout if *x+ also matches).
exten => *,1,NoOp(PhoneHome Messages IVR bare * from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,vm,1)

; Raw SIP extensions (2001–2899) must never ring another ATA. PhoneHome
; speed-dial is 0–9 only. Factory HT801 plans or a SIP client with the
; analog secret would otherwise hit stock FreePBX from-internal and skip
; Circle / mutual allowlist.
exten => _2XXX,1,NoOp(PhoneHome block raw SIP ext ${EXTEN} from ${CALLERID(num)})
 same => n,Goto(phonehome-stasis,${EXTEN},1)

[phonehome-stasis]
; Single digit 0 (Home), 1 (TreeHouse), 2–9 (speed dial) and longer digit strings
exten => _[0-9],1,NoOp(PhoneHome Stasis digits=${EXTEN})
 same => n,Stasis(phonehome,${EXTEN})
 same => n,Hangup()
exten => _X.,1,NoOp(PhoneHome Stasis digits=${EXTEN})
 same => n,Stasis(phonehome,${EXTEN})
 same => n,Hangup()
; Voicemail / greeting IVR (*98)
exten => vm,1,NoOp(PhoneHome Stasis Messages IVR)
 same => n,Stasis(phonehome,vm)
 same => n,Hangup()

; Whisper/screening + outbound dial confirm: natural TTS (never SayAlpha — that spells).
; Bridged sets PH_ANNOUNCE_NAME (letters/spaces only) and PH_ANNOUNCE_PREFIX
; ("Call from" inbound / "Calling" outbound), then continueInDialplan → here → Stasis(post-announce).
; Note: asterisk22-flite does not set FLITESTATUS; do not gate on it or you always fall through.
; Voice: asterisk22-flite is Flite(text[,intkeys]) only — pick US English in flite.conf (voice=slt).
; Do not pass Flite(...,kal); the second arg is interrupt keys, not voice name.
[phonehome-announce]
exten => s,1,NoOp(PhoneHome FXS announce prefix=${PH_ANNOUNCE_PREFIX} name=${PH_ANNOUNCE_NAME})
 same => n,Answer()
 same => n,GotoIf($["${PH_ANNOUNCE_PREFIX}" = ""]?defprefix:haveprefix)
 same => n(defprefix),Set(PH_ANNOUNCE_PREFIX=Call from)
 same => n(haveprefix),Set(PH_ANNOUNCE_PHRASE=${PH_ANNOUNCE_PREFIX} ${PH_ANNOUNCE_NAME})
 same => n,Flite(${PH_ANNOUNCE_PHRASE})
 same => n,Stasis(phonehome,post-announce)
 same => n,Hangup()

; IVR prompts (Grandparents menu / TreeHouse / *98 Flite fallback).
; Barge-in (PH_IVR_MEDIA set): Read() plays the Piper URL and returns the digit.
; ARI channel.play cannot — res_stasis_playback calls ast_control_streamfile with
; stop=NULL, which discards DTMF, so ChannelDtmfReceived never fires.
; No media URL: Flite PH_IVR_TEXT. Quote it. Unquoted commas are intkeys — so
; "To call Gramma East, press 1. To call…" only spoke through the first name.
; PH_IVR_INTKEYS (e.g. 1234): Flite barge-in; Read catches a digit Flite queued.
; Digit returns as Stasis arg post-ivr-say,<digit>.
[phonehome-ivr-say]
exten => s,1,NoOp(PhoneHome IVR say)
 same => n,Answer()
 same => n,Set(PH_IVR_DIGIT=)
 same => n,GotoIf($["${PH_IVR_MEDIA}" != ""]?piper)
 same => n,GotoIf($["${PH_IVR_TEXT}" = ""]?empty:speak)
 same => n(empty),Stasis(phonehome,post-ivr-say)
 same => n,Hangup()
 same => n(piper),NoOp(PhoneHome IVR piper read)
 same => n,Read(PH_IVR_DIGIT,${PH_IVR_MEDIA},1,,1,12)
 same => n,NoOp(PhoneHome IVR digit=${PH_IVR_DIGIT} status=${READSTATUS})
 same => n,Stasis(phonehome,post-ivr-say,${PH_IVR_DIGIT},${READSTATUS})
 same => n,Hangup()
 same => n(speak),GotoIf($["${PH_IVR_INTKEYS}" = ""]?fliteplain:fliteint)
 same => n(fliteplain),Flite("${PH_IVR_TEXT}")
 same => n,Stasis(phonehome,post-ivr-say)
 same => n,Hangup()
 same => n(fliteint),Flite("${PH_IVR_TEXT}",${PH_IVR_INTKEYS})
 same => n,Read(PH_IVR_DIGIT,,1,,,12)
 same => n,Stasis(phonehome,post-ivr-say,${PH_IVR_DIGIT})
 same => n,Hangup()
