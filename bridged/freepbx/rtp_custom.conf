; PhoneHome — MUST match eero UDP forward 10000–10200 → FreePBX (10.0.5.105)
; Install: /etc/asterisk/rtp_custom.conf (included last from rtp.conf).
; FreePBX regenerates rtp_additional.conf with rtpend=20000 on Apply Config.
; Asterisk takes the FIRST rtpstart/rtpend (additional is included before custom),
; so after every fwconsole reload also set rtp_additional.conf rtpend=10200 —
; custom alone does not win. Or widen eero to UDP 10000–20000 → 10.0.5.105.
[general]
rtpstart=10000
rtpend=10200
strictrtp=no
