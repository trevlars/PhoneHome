; PhoneHome — call-path evidence log for FreePBX/Asterisk.
; Install: /etc/asterisk/logger_logfiles_custom.conf (included from logger.conf;
; FreePBX regenerates logger_logfiles_additional.conf, this file is preserved).
;
; FreePBX ships with core verbosity 0, which silently drops the messages that
; explain one-way analog audio:
;   verbose(2)  "SRTP unprotect failed on SSRC ... because of authentication failure"
;   verbose(3)  "Channel PJSIP/2001-... joined 'simple_bridge' stasis-bridge"
;               (native_rtp vs simple_bridge vs softmix per call)
; verbose(3) never includes SIP passwords, SDP crypto lines or DTLS/SRTP keys —
; those only appear under `pjsip set logger on` / debug, which stays off.
phonehome-verbose => verbose(3),notice,warning,error
