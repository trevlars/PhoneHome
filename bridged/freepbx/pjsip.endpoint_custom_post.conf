; PhoneHome — TLS + SRTP (SDES) for FXS extension(s)
; Managed by phonehome-set-sip-secret — do not hand-edit ATA blocks.
; lan: rewrite_contact=no (lab / same-LAN Contact). remote: rewrite_contact=yes + media_address=public IP
; (Contact is PVE proxy; without media_address SDP stays private → no audio).
;
; Live FreePBX file is rewritten on each ATA sync. This copy is the reference
; shape for ops; prefer running phonehome-set-sip-secret over hand-editing.

; PhoneHome ATA 2001 (lan)
[2001](+)
transport=0.0.0.0-tls
media_encryption=sdes
media_encryption_optimistic=no
rewrite_contact=no
direct_media=no
force_rport=yes
rtp_symmetric=yes
rtp_keepalive=0
outbound_auth=2001-auth

; PhoneHome ATA 2002 (remote)
[2002](+)
transport=0.0.0.0-tls
media_encryption=sdes
media_encryption_optimistic=no
rewrite_contact=yes
media_address=50.36.49.13
direct_media=no
force_rport=yes
rtp_symmetric=yes
rtp_keepalive=15
outbound_auth=2002-auth
