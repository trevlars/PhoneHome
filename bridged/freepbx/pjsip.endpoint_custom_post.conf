; PhoneHome — TLS + SRTP (SDES) for FXS extension(s)
; Install on FreePBX: /etc/asterisk/pjsip.endpoint_custom_post.conf
; Add a matching [ext](+) block when provisioning more ATA extensions.
;
; rewrite_contact=no: lab SIP TLS hits PVE socat (:5061 → FreePBX). With
; rewrite_contact=yes, Contact becomes 10.0.5.31:<ephemeral> and RTP/SRTP goes
; to the proxy (no media) → "lack of audio RTP activity". Keep the ATA's own
; Contact URI (e.g. 10.0.4.42:5060) for media while SIP still arrives via proxy.
; direct_media=no: media must stay on Asterisk for ExternalMedia ↔ WebRTC.
[2001](+)
transport=0.0.0.0-tls
media_encryption=sdes
media_encryption_optimistic=no
rewrite_contact=no
direct_media=no
