; PhoneHome — SIP TLS for remote HT801s
; Install on FreePBX: /etc/asterisk/pjsip.transports_custom.conf
; Cert: /etc/asterisk/keys/phonehome-sip.{crt,key}
; Prefer Let's Encrypt via deploy/sync-phonehome-sip-cert.sh (from Caddy on PVE).
; SAN must match SIP_PUBLIC_HOST (mothership.example). Do not fall back to
; self-signed for production parents — ATA cert validation stays on for FQDNs.
[0.0.0.0-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/phonehome-sip.crt
priv_key_file=/etc/asterisk/keys/phonehome-sip.key
method=tlsv1_2
allow_reload=yes
; Hostname, not a baked-in WAN IP. Endpoint media_address overrides this.
; Do not point it at a name the mothership DNS rewrites to a LAN address
; unless every remote endpoint sets its own public media_address.
external_media_address=mothership.example
external_signaling_address=mothership.example
external_signaling_port=5061
; Keep TLS sessions to remotes alive through the PVE socat proxy so Contact
; stays usable for FreePBX→ATA originates after a call.
tcp_keepalive_enable=yes
tcp_keepalive_idle_time=15
tcp_keepalive_interval_time=10
tcp_keepalive_probe_count=3
; Reuse the inbound TLS socket for qualify/INVITE (required with rewrite_contact
; through socat — otherwise Contacts stick Unavail and analogs go dark).
symmetric_transport=yes
; Only treat true home-LAN ATAs (e.g. Alex HT801 at 192.168.1.42) as local for SDP.
; Do NOT use 10.0.0.0/8 — remote ATAs use rewrite_contact=yes and Contact becomes
; the PVE SIP TLS proxy (192.168.2.31). That IP is in 10/8, so a wide local_net makes
; Asterisk advertise private RTP (192.168.2.105) to Sam → ring works, no audio.
; EXAMPLE. Set local_net to the subnet where the house adapters live before installing.
; A wrong local_net makes remote adapters ring with no audio.
local_net=192.168.1.0/24
