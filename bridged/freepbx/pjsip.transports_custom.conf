; PhoneHome — SIP TLS for remote HT801s
; Install on FreePBX: /etc/asterisk/pjsip.transports_custom.conf
; Cert: /etc/asterisk/keys/phonehome-sip.{crt,key}
; Prefer Let's Encrypt via deploy/sync-phonehome-sip-cert.sh (from Caddy on PVE).
; SAN must match SIP_PUBLIC_HOST (y5876647.eero.online). Do not fall back to
; self-signed for production parents — ATA cert validation stays on for FQDNs.
[0.0.0.0-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/phonehome-sip.crt
priv_key_file=/etc/asterisk/keys/phonehome-sip.key
method=tlsv1_2
allow_reload=yes
external_media_address=y5876647.eero.online
external_signaling_address=y5876647.eero.online
external_signaling_port=5061
local_net=10.0.0.0/8
local_net=192.168.0.0/16
local_net=172.16.0.0/12
