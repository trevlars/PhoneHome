name: PhoneHomeMothership
options:
  bundleIdPrefix: com.phonehome
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  Mothership:
    type: application
    platform: macOS
    sources:
      - path: Mothership/App
    resources:
      - path: Mothership/Resources
        optional: true
        buildPhase: resources
    settings:
      PRODUCT_NAME: PhoneHome Mothership
      PRODUCT_BUNDLE_IDENTIFIER: com.phonehome.mothership
      INFOPLIST_FILE: Mothership/App/Info.plist
      CODE_SIGN_ENTITLEMENTS: Mothership/App/Mothership.entitlements
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
